version: 2.1

orbs:
  prodsec: snyk/prodsec-orb@1
  win: circleci/windows@5.0.0

executors:
  docker-node:
    parameters:
      version:
        default: "lts"
        type: string
    docker:
      - image: cimg/node:<<parameters.version>>

commands:
  install:
    steps:
      - run:
          name: Install
          command: npm ci
  test:
    steps:
      - run:
          name: Test
          command: npm test
  release:
    steps:
      - run:
          name: Release
          command: |
            NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            export NPM_ID_TOKEN
            npx semantic-release

jobs:
  security_scans:
    resource_class: small
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - prodsec/security_scans:
          mode: auto
          release-branch: master

  test_and_scan:
    resource_class: small
    executor:
      name: docker-node
    steps:
      - checkout
      - install
      - test

  test_windows:
    executor:
      name: win/default
      size: medium
      shell: bash.exe
    steps:
      - run:
          name: Keep LF line endings
          command: git config --global core.autocrlf false
      - checkout
      - run:
          name: Install Node LTS
          command: |
            nvm install lts
            nvm use lts
      - run:
          name: Node and npm version
          command: node --version && npm --version
      - install
      - test

  release_package:
    resource_class: small
    executor:
      name: docker-node
      version: "24.15"
    steps:
      - checkout
      - install
      - release

workflows:
  ci_cd:
    jobs:
      - prodsec/secrets-scan:
          name: Scan repository for secrets
          context:
            - snyk-bot-slack
            - prodsec-orb-runtime
          channel: cli-alerts

      - security_scans:
          context:
            - devex_cli
            - endpoint-experience
            - prodsec-orb-runtime

      - test_and_scan:
          name: Test and scan
          context: 
            - nodejs-install
            - devex_cli

      - test_windows:
          name: Test on Windows
          context:
            - nodejs-install
            - devex_cli

      - release_package:
          name: Release
          context:
            - nodejs-install
            - github-release
          requires:
            - Test and scan
            - Test on Windows
          filters:
            branches:
              only:
                - master
